services:
  memgraph-db:
    image: memgraph/memgraph-mage:latest 
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    env_file:
      - .env
    environment:
      MEMGRAPH_USER: ${MEMGRAPH_USER}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD}
    networks:
      - backend-net

  memgraph-lab:
    image: memgraph/lab:latest 
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - memgraph-db
    env_file:
      - .env
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph-db
      - QUICK_CONNECT_MG_PORT=7687
      - QUICK_CONNECT_MG_USERNAME=${MEMGRAPH_USER}
      - QUICK_CONNECT_MG_PASSWORD=${MEMGRAPH_PASSWORD}
      - LOG_LEVEL=error
    networks:
      - backend-net   # ← brakowało tego!

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - memgraph-db
    ports:
      - "8000:8000"
    networks:
      - backend-net
      - frontend-net
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/

  frontend:
    build: ./frontend
    restart: "no"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      # Adres backendu widziany PRZEZ PRZEGLĄDARKĘ (WebSocket + polling).
      # Musi być osiągalny z komputera hosta, dlatego localhost, nie "backend".
      PUBLIC_API_BASE_URL: http://localhost:8000
      # Adres backendu widziany przez frontend PODCZAS SSR (wewnątrz sieci Dockera).
      API_INTERNAL_URL: http://backend:8000
    networks:
      - frontend-net
      - backend-net
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .svelte-kit/
        - action: rebuild
          path: ./frontend/package.json

volumes:
  db-data:

networks:
  backend-net:
  frontend-net: