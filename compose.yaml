services:
  memgraph-db:
    image: memgraph/memgraph-mage:3.10.1
    restart: unless-stopped
    ports:
      - "7687:7687"
      - "7444:7444"
    env_file:
      - .env
    environment:
      MEMGRAPH_USER: ${MEMGRAPH_USER}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD}

  memgraph-lab:
    image: memgraph/lab:3.10.1
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - memgraph-db
    env_file:
      - .env
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph-db
      - QUICK_CONNECT_MG_PORT=7687
      - QUICK_CONNECT_MG_USERNAME=${MEMGRAPH_USER}
      - QUICK_CONNECT_MG_PASSWORD=${MEMGRAPH_PASSWORD}
      - LOG_LEVEL=error

  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      - memgraph-db
    ports:
      - "8000:8000"
    networks:
      - backend-net
      - frontend-net
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/

  frontend:
    build: ./frontend
    restart: "no"
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - frontend-net
      - backend-net
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .svelte-kit/
        - action: rebuild
          path: ./frontend/package.json

  # nginx:
  #     image: nginx:stable-alpine3.21
  #     restart: always
  #     ports:
  #         - "80:80" # http
  #         - "443:443" # https
  #     volumes:
  #         - ./frontend/default.conf:/etc/nginx/conf.d/default.conf
  #         - ./data/certbot/conf:/etc/letsencrypt
  #         - ./data/certbot/www:/var/www/certbot
  #     depends_on:
  #         - frontend
  #         - backend
  #     networks:
  #         - frontend-net

volumes:
  db-data:

networks:
  backend-net:
  frontend-net:
